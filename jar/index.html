<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Bloomin — Collabs</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../shop/mbnav.css?v=1794447412">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050103;min-height:100%}
/* the jar container: drop .mb-jar anywhere and call MBJar.mount on it */
.mb-jar{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}   /* fills the whole screen on this page, no gap under it */
html,body{overflow:hidden}
.mb-jar canvas{display:block;width:100%;height:100%;cursor:grab}
.mb-jar canvas:active{cursor:grabbing}
.back{position:fixed;top:18px;left:18px;z-index:2;width:64px;height:64px;display:block}
.back canvas{width:100%;height:100%}
/* the song: starts on the first tap (phones only allow sound after one); this button mutes / unmutes it */
.collab{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:2;width:min(56vw,360px);transform:translateX(-50%);
  pointer-events:none;opacity:0;animation:collabIn 1.2s ease 3.6s forwards}
.collab img{display:block;width:100%;height:auto}
@keyframes collabIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (min-width:761px){.collab{bottom:14px;width:250px}}
/* the song button: a white wobbling blob with a black outline, like the menu's; ▶ before it plays, moving bars while
   it plays, tap to pause / play */
.snd{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:3;width:56px;height:56px;border:0;padding:0;background:none;
  color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.snd:before{content:"";position:absolute;inset:0;background:#fff;border:2.5px solid #111;border-radius:48% 52% 46% 54% / 62% 48% 52% 38%;
  animation:mbnBlobWobble 3.2s ease-in-out infinite;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.snd:active:before{transform:scale(.9)}
.snd > *{position:relative}
.snd .play{width:18px;height:18px;margin-left:3px}
.snd .bars{display:none;align-items:flex-end;gap:2.5px;height:18px}
.snd .bars i{display:block;width:3.5px;background:currentColor;border-radius:2px;height:30%;animation:sndBar .9s ease-in-out infinite}
.snd .bars i:nth-child(2){animation-delay:-.3s}.snd .bars i:nth-child(3){animation-delay:-.6s}.snd .bars i:nth-child(4){animation-delay:-.15s}
.snd.playing .bars{display:flex}.snd.playing .play{display:none}
@keyframes sndBar{0%,100%{height:25%}50%{height:100%}}
@keyframes mbnBlobWobble{0%,100%{border-radius:48% 52% 46% 54% / 62% 48% 52% 38%}33%{border-radius:55% 45% 52% 48% / 45% 60% 40% 58%}66%{border-radius:44% 56% 50% 50% / 56% 40% 62% 46%}}
</style>
</head>
<body>
<a class="back" href="../" aria-label="Back to Metro Bloomin"><canvas width="384" height="384"></canvas></a>
<div class="mb-jar" id="jar" aria-label="Metro Bloomin jar, 3D"></div>
<div class="collab"><img src="kencarson.png?v=1" alt="Ken Carson" width="1215" height="579"></div>
<audio id="song" src="rock-n-roll.mp3?v=1" loop preload="auto"></audio>
<button class="snd" id="snd" type="button" aria-label="Play music">
  <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"/></svg>
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</button>
<script>
// the song: plays from the first tap anywhere (phones block sound until then); the button toggles it
(function () {
  var a = document.getElementById('song'), b = document.getElementById('snd'), wanted = true
  a.volume = 0.7
  function ui() { var on = !a.paused; b.classList.toggle('playing', on); b.setAttribute('aria-label', on ? 'Pause music' : 'Play music') }
  function play() { var p = a.play(); if (p && p.then) p.then(ui).catch(ui); else ui() }
  ;['pointerdown', 'keydown'].forEach(function (e) { window.addEventListener(e, function first(ev) {
    if (ev.target.closest && ev.target.closest('#snd')) return
    window.removeEventListener(e, first, true); if (wanted && a.paused) play() }, true) })
  b.addEventListener('click', function () { if (a.paused) { wanted = true; play() } else { wanted = false; a.pause(); ui() } })
  a.addEventListener('play', ui); a.addEventListener('pause', ui)
  document.addEventListener('visibilitychange', function () { if (document.hidden) a.pause(); else if (wanted && a.currentTime > 0) play() })
  play()   // desktop browsers may allow it straight away
})()
</script>
<script src="../shop/mbnav.js?v=1794447412"></script>
<script>
// the site's one menu, inverted like on every view; collabs is this page
document.body.appendChild(MBNav.create({
  items: [{ label: 'shop', href: '../#shop' }, { label: 'videos', href: '../#videos' }, { label: 'collabs', href: './' }, { label: 'about', href: '../#about' }],
  current: 'collabs', tone: 'auto'
})).classList.add('mbn--site')
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import { mount } from './jar.js?v=22'
window.__jar = mount(document.getElementById('jar'))
// header leaf: the site's stacked-alpha still (colour on top, mask below) painted into the canvas
const im = new Image(); im.onload = () => {
  const cv = document.querySelector('.back canvas'), g = cv.getContext('2d'), t = document.createElement('canvas'); t.width = 384; t.height = 768
  const tx = t.getContext('2d'); tx.drawImage(im, 0, 0, 384, 768)
  const c = tx.getImageData(0, 0, 384, 384), m = tx.getImageData(0, 384, 384, 384).data
  for (let k = 3; k < c.data.length; k += 4) c.data[k] = m[k - 3]
  g.putImageData(c, 0, 0)
}; im.src = '../shop/bg/leaf.webp'
</script>
</body>
</html>
