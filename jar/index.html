<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Bloomin — Collabs</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../shop/mbnav.css?v=1794447412">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050103;min-height:100%}
/* the jar container: drop .mb-jar anywhere and call MBJar.mount on it */
.mb-jar{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}   /* fills the whole screen on this page, no gap under it */
html,body{overflow:hidden}
.mb-jar canvas{display:block;width:100%;height:100%;cursor:grab}
.mb-jar canvas:active{cursor:grabbing}
.back{position:fixed;top:18px;left:18px;z-index:2;width:64px;height:64px;display:block}
.back canvas{width:100%;height:100%}
/* the song: starts on the first tap (phones only allow sound after one); this button mutes / unmutes it */
.snd{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:3;width:46px;height:46px;border:0;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.snd svg{width:22px;height:22px}
.snd .bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.snd .bars i{display:block;width:3px;background:currentColor;border-radius:2px;height:30%}
.snd.playing .bars i{animation:sndBar .9s ease-in-out infinite}
.snd.playing .bars i:nth-child(2){animation-delay:-.3s}.snd.playing .bars i:nth-child(3){animation-delay:-.6s}.snd.playing .bars i:nth-child(4){animation-delay:-.15s}
@keyframes sndBar{0%,100%{height:25%}50%{height:100%}}
.snd .x{display:none}.snd.muted .bars{display:none}.snd.muted .x{display:block}
</style>
</head>
<body>
<a class="back" href="../" aria-label="Back to Metro Bloomin"><canvas width="384" height="384"></canvas></a>
<div class="mb-jar" id="jar" aria-label="Metro Bloomin jar, 3D"></div>
<audio id="song" src="rock-n-roll.mp3?v=1" loop preload="auto"></audio>
<button class="snd muted" id="snd" type="button" aria-label="Play music">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.2-1.2-2.7 2.7-2.7-2.7-1.2 1.2 2.7 2.7-2.7 2.7 1.2 1.2 2.7-2.7 2.7 2.7 1.2-1.2z"/></svg>
</button>
<script>
// the song: plays from the first tap anywhere (phones block sound until then); the button toggles it
(function () {
  var a = document.getElementById('song'), b = document.getElementById('snd'), wanted = true
  a.volume = 0.7
  function ui() { var on = !a.paused && !a.muted; b.classList.toggle('playing', on); b.classList.toggle('muted', !on); b.setAttribute('aria-label', on ? 'Mute music' : 'Play music') }
  function play() { var p = a.play(); if (p && p.then) p.then(ui).catch(ui); else ui() }
  ;['pointerdown', 'keydown'].forEach(function (e) { window.addEventListener(e, function first(ev) {
    if (ev.target.closest && ev.target.closest('#snd')) return
    window.removeEventListener(e, first, true); if (wanted && a.paused) play() }, true) })
  b.addEventListener('click', function () { if (a.paused) { wanted = true; a.muted = false; play() } else { a.muted = !a.muted; ui() } })
  a.addEventListener('play', ui); a.addEventListener('pause', ui)
  document.addEventListener('visibilitychange', function () { if (document.hidden) a.pause(); else if (wanted && !a.muted && a.currentTime > 0) play() })
  play()   // desktop browsers may allow it straight away
})()
</script>
<script src="../shop/mbnav.js?v=1794447412"></script>
<script>
// the site's one menu, inverted like on every view; collabs is this page
document.body.appendChild(MBNav.create({
  items: [{ label: 'shop', href: '../#shop' }, { label: 'videos', href: '../#videos' }, { label: 'collabs', href: './' }, { label: 'about', href: '../#about' }],
  current: 'collabs', tone: 'auto'
})).classList.add('mbn--site')
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import { mount } from './jar.js?v=21'
window.__jar = mount(document.getElementById('jar'))
// header leaf: the site's stacked-alpha still (colour on top, mask below) painted into the canvas
const im = new Image(); im.onload = () => {
  const cv = document.querySelector('.back canvas'), g = cv.getContext('2d'), t = document.createElement('canvas'); t.width = 384; t.height = 768
  const tx = t.getContext('2d'); tx.drawImage(im, 0, 0, 384, 768)
  const c = tx.getImageData(0, 0, 384, 384), m = tx.getImageData(0, 384, 384, 384).data
  for (let k = 3; k < c.data.length; k += 4) c.data[k] = m[k - 3]
  g.putImageData(c, 0, 0)
}; im.src = '../shop/bg/leaf.webp'
</script>
</body>
</html>
