<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Bloomin — Collabs</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../shop/mbnav.css?v=1794447412">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050103;min-height:100%}
/* the jar container: drop .mb-jar anywhere and call MBJar.mount on it */
.mb-jar{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}   /* fills the whole screen on this page, no gap under it */
html,body{overflow:hidden}
.mb-jar canvas{display:block;width:100%;height:100%;cursor:grab}
.mb-jar canvas:active{cursor:grabbing}
.back{position:fixed;top:18px;left:18px;z-index:2;width:64px;height:64px;display:block}
.back canvas{width:100%;height:100%}
/* the song: starts on the first tap (phones only allow sound after one); this button mutes / unmutes it */
.collab{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:2;width:min(56vw,360px);transform:translateX(-50%);
  pointer-events:none;opacity:0;animation:collabIn 1.2s ease 3.6s forwards}
.collab img,.collab canvas{display:block;width:100%;height:auto}
@keyframes collabIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (min-width:761px){.collab{bottom:14px;width:250px}}
/* the song button: a white wobbling blob with a black outline, like the menu's; ▶ before it plays, moving bars while
   it plays, tap to pause / play */
.snd{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:3;width:56px;height:56px;border:0;padding:0;background:none;
  color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.snd:before{content:"";position:absolute;inset:0;background:#fff;border:2.5px solid #111;border-radius:48% 52% 46% 54% / 62% 48% 52% 38%;
  animation:mbnBlobWobble 3.2s ease-in-out infinite;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.snd:active:before{transform:scale(.9)}
.snd > *{position:relative}
.snd .play{width:18px;height:18px;margin-left:3px}
.snd .bars{display:none;align-items:flex-end;gap:2.5px;height:18px}
.snd .bars i{display:block;width:3.5px;background:currentColor;border-radius:2px;height:30%;animation:sndBar .9s ease-in-out infinite}
.snd .bars i:nth-child(2){animation-delay:-.3s}.snd .bars i:nth-child(3){animation-delay:-.6s}.snd .bars i:nth-child(4){animation-delay:-.15s}
.snd.playing .bars{display:flex}.snd.playing .play{display:none}
@keyframes sndBar{0%,100%{height:25%}50%{height:100%}}
/* collab switch (top centre): white wobbling blobs with a black outline like the menu; the chosen one is black */
.pick{position:fixed;top:calc(30px + env(safe-area-inset-top));left:50%;z-index:3;transform:translateX(-50%);display:flex;gap:8px}
.pick button{position:relative;border:0;background:none;padding:9px 14px;font:600 11px/1 Arial,Helvetica,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:#111;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.pick button:before{content:"";position:absolute;inset:0;z-index:-1;background:#fff;border:2px solid #111;border-radius:48% 52% 46% 54% / 62% 48% 52% 38%;
  animation:mbnBlobWobble 3.2s ease-in-out infinite}
.pick button:nth-child(2):before{animation-delay:-1.4s}
.pick{isolation:isolate}
.pick button.on{color:#fff}.pick button.on:before{background:#111;border-color:#fff}
.collab.off{display:none}
@media (min-width:761px){.pick{top:34px}.pick button{font-size:12px;padding:11px 18px}}
@keyframes mbnBlobWobble{0%,100%{border-radius:48% 52% 46% 54% / 62% 48% 52% 38%}33%{border-radius:55% 45% 52% 48% / 45% 60% 40% 58%}66%{border-radius:44% 56% 50% 50% / 56% 40% 62% 46%}}
</style>
</head>
<body>
<a class="back" href="../" aria-label="Back to Metro Bloomin"><canvas width="384" height="384"></canvas></a>
<div class="mb-jar" id="jar" aria-label="Metro Bloomin jar, 3D"></div>
<div class="pick" role="tablist" aria-label="Collabs"><button type="button" data-c="kencarson">X41</button><button type="button" data-c="qrome">QRÖME</button></div>
<div class="collab" data-c="kencarson"><img src="kencarson.png?v=1" alt="Ken Carson" width="1215" height="579"></div>
<div class="collab off" data-c="qrome"><canvas id="word" width="480" height="260" role="img" aria-label="Metro Bloomin"></canvas></div>
<audio id="song" src="rock-n-roll.mp3?v=1" loop preload="auto"></audio>
<button class="snd" id="snd" type="button" aria-label="Play music">
  <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"/></svg>
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
</button>
<script>
// the song: plays from the first tap anywhere (phones block sound until then); the button toggles it
(function () {
  var a = document.getElementById('song'), b = document.getElementById('snd'), wanted = true
  a.volume = 0.7
  function ui() { var on = !a.paused; b.classList.toggle('playing', on); b.setAttribute('aria-label', on ? 'Pause music' : 'Play music') }
  function play() { var p = a.play(); if (p && p.then) p.then(ui).catch(ui); else ui() }
  ;['pointerdown', 'keydown'].forEach(function (e) { window.addEventListener(e, function first(ev) {
    if (ev.target.closest && ev.target.closest('#snd')) return
    window.removeEventListener(e, first, true); if (wanted && a.paused) play() }, true) })
  b.addEventListener('click', function () { if (a.paused) { wanted = true; play() } else { wanted = false; a.pause(); ui() } })
  a.addEventListener('play', ui); a.addEventListener('pause', ui)
  document.addEventListener('visibilitychange', function () { if (document.hidden) a.pause(); else if (wanted && a.currentTime > 0) play() })
  // each collab has its own song (Ken Carson: rock-n-roll; QRÖME: the QRÖME video's track)
  window.MBSong = function (src) { if (a.getAttribute('src') === src) return; var was = !a.paused; a.setAttribute('src', src); a.load(); if (was || wanted) play() }
  play()   // desktop browsers may allow it straight away
})()
</script>
<script src="../shop/mbnav.js?v=1794447412"></script>
<script>
// the site's one menu, inverted like on every view; collabs is this page
document.body.appendChild(MBNav.create({
  items: [{ label: 'shop', href: '../#shop' }, { label: 'videos', href: '../#videos' }, { label: 'collabs', href: './' }, { label: 'about', href: '../#about' }],
  current: 'collabs', tone: 'auto'
})).classList.add('mbn--site')
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import { mount } from './jar.js?v=35'
// two collabs: Ken Carson and QRÖME. The switch (or #qrome in the link) swaps the jar, the name and the song.
// QRÖME's name: the site's animated METRO BLOOMIN lettering (stacked-alpha video, colour on top, mask below, as on
// the shop page), drawn into a canvas; plays each time QRÖME is picked; the still if the phone blocks the video
const word = (() => {
  const cv = document.getElementById('word'), out = cv.getContext('2d'), W = 480, H = 260
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H * 2
  const tx = tmp.getContext('2d', { willReadFrequently: true })
  const paint = (src) => { tx.clearRect(0, 0, W, H * 2); tx.drawImage(src, 0, 0, W, H * 2)
    const c = tx.getImageData(0, 0, W, H), m = tx.getImageData(0, H, W, H).data, d = c.data
    for (let k = 3; k < d.length; k += 4) d[k] = m[k - 3]; out.putImageData(c, 0, 0) }
  const still = new Image(); still.src = '../shop/bg/word-sm.webp?v=3'
  const v = document.createElement('video'); v.muted = true; v.defaultMuted = true; v.playsInline = true
  v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = '../shop/bg/word-sm.mp4?v=3'
  // once it has played: wipe the loose sparkle dots left on the last frame (any bit smaller than a letter piece)
  const tidy = () => {
    const img = out.getImageData(0, 0, W, H), d = img.data, seen = new Uint8Array(W * H), stack = []
    for (let i = 0; i < W * H; i++) {
      if (seen[i] || d[i * 4 + 3] < 40) continue
      const bit = []; stack.push(i); seen[i] = 1
      while (stack.length) { const j = stack.pop(); bit.push(j); const x = j % W, y = (j / W) | 0
        for (const k of [j - 1, j + 1, j - W, j + W]) { if (k < 0 || k >= W * H || seen[k] || d[k * 4 + 3] < 40) continue
          if ((k === j - 1 && x === 0) || (k === j + 1 && x === W - 1)) continue; seen[k] = 1; stack.push(k) } }
      if (bit.length < 60) bit.forEach((j) => { d[j * 4 + 3] = 0 })
    }
    out.putImageData(img, 0, 0)
  }
  v.addEventListener('ended', () => { paint(v); tidy() })
  const showStill = () => { if (still.complete && still.naturalWidth) { paint(still); tidy() } else still.onload = () => { paint(still); tidy() } }
  let last = -1, raf = 0
  const loop = () => { if (v.readyState >= 2 && v.currentTime !== last) { last = v.currentTime; paint(v) }   // only new frames
    if (!v.ended && !v.paused) raf = requestAnimationFrame(loop) }
  return { play() { cancelAnimationFrame(raf); out.clearRect(0, 0, W, H); last = -1; v.currentTime = 0
    const p = v.play(); if (p && p.then) p.then(() => { raf = requestAnimationFrame(loop) }).catch(showStill); else raf = requestAnimationFrame(loop) } }
})()
function playWord() { word.play() }
const SONGS = { kencarson: 'rock-n-roll.mp3?v=1', qrome: 'wow-wow.mp3?v=1' }
function pick(c) {
  if (window.__jar && window.__jar.collab === c) return
  if (window.__jar) window.__jar.destroy()
  window.__jar = mount(document.getElementById('jar'), c)
  document.querySelectorAll('.pick button').forEach((b) => { const on = b.dataset.c === c; b.classList.toggle('on', on); b.setAttribute('aria-selected', on) })
  document.querySelectorAll('.collab').forEach((n) => n.classList.toggle('off', n.dataset.c !== c))   // each collab's name at the bottom
  if (window.MBSong) window.MBSong(SONGS[c])
  if (c === 'qrome') playWord()
  history.replaceState(null, '', c === 'qrome' ? '#qrome' : location.pathname + location.search)
}
document.querySelectorAll('.pick button').forEach((b) => b.addEventListener('click', () => pick(b.dataset.c)))
pick(location.hash === '#qrome' ? 'qrome' : 'kencarson')
// header leaf: the site's stacked-alpha still (colour on top, mask below) painted into the canvas
const im = new Image(); im.onload = () => {
  const cv = document.querySelector('.back canvas'), g = cv.getContext('2d'), t = document.createElement('canvas'); t.width = 384; t.height = 768
  const tx = t.getContext('2d'); tx.drawImage(im, 0, 0, 384, 768)
  const c = tx.getImageData(0, 0, 384, 384), m = tx.getImageData(0, 384, 384, 384).data
  for (let k = 3; k < c.data.length; k += 4) c.data[k] = m[k - 3]
  g.putImageData(c, 0, 0)
}; im.src = '../shop/bg/leaf.webp'
</script>
